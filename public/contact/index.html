<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Kenta Shiki</title>
    <meta name="description" content="Contact Kenta Shiki for research, product development, and interdisciplinary collaboration." />
    <link rel="alternate" hreflang="en" href="./" />
    <link rel="alternate" hreflang="ja" href="../ja/contact/" />
    <link rel="stylesheet" href="../assets/css/global.css?v=20260730d" />
    <link rel="stylesheet" href="../assets/css/editorial.css?v=20261018c" />
    <link rel="stylesheet" href="../contact/contact.css?v=20261018d" />
    <link rel="icon" href="../assets/images/favicon.ico" />
  </head>
  <body class="shell-ready editorial-page contact-page" data-root="../" data-section="contact" data-page="contact" data-locale="en">
    <div data-site-header></div>
    <main id="main-content">
      <div class="page-hero">
        <div class="page-hero-content"><h1>Contact</h1></div>
      </div>
      <div class="contact-container">
        <div class="contact-introduction">
          <p class="contact-invitation">Let’s share<br />ideas.</p>
          <p class="contact-description">Interested in collaborating on research or product development? Feel free to get in touch.</p>
        </div>
        <section class="contact-channel" aria-labelledby="form-title">
          <h2 id="form-title">Contact Form</h2>
          <p class="contact-form-notice" id="contact-form-notice" role="status" aria-live="polite" aria-atomic="true">This form is not accepting submissions yet. For now, please reach out through the <a href="#profiles-title">social links below</a>.</p>
          <form class="contact-form" method="post" action="../api/contact.php" aria-labelledby="form-title" aria-describedby="contact-form-notice" data-contact-form>
            <div class="contact-form-row">
              <div class="contact-form-field">
                <label for="contact-name">Name <span class="contact-field-status">Required</span></label>
                <input id="contact-name" name="name" type="text" maxlength="100" autocomplete="name" required />
              </div>
              <div class="contact-form-field">
                <label for="contact-email">Email address <span class="contact-field-status">Required</span></label>
                <input id="contact-email" name="email" type="email" maxlength="254" autocomplete="email" inputmode="email" required />
              </div>
            </div>
            <div class="contact-form-field">
              <label for="contact-subject">Subject <span class="contact-field-status">Optional</span></label>
              <input id="contact-subject" name="subject" type="text" maxlength="150" />
            </div>
            <div class="contact-form-field">
              <label for="contact-message">Message <span class="contact-field-status">Required</span></label>
              <textarea id="contact-message" name="message" rows="7" maxlength="5000" required></textarea>
            </div>
            <div class="contact-form-trap" aria-hidden="true">
              <label for="contact-website">Leave this field empty</label>
              <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off" />
            </div>
            <button class="contact-form-submit" type="submit" aria-describedby="contact-form-notice" disabled>Send message</button>
          </form>
        </section>
        <section class="contact-channel" aria-labelledby="profiles-title">
          <h2 id="profiles-title">Links</h2>
          <ul class="contact-profiles">
              <li><a href="https://www.linkedin.com/in/kentashiki/" target="_blank" rel="noopener noreferrer"><img src="../assets/images/social/linkedin-logo.png" alt="" width="18" height="18" />LinkedIn</a></li>
              <li><a href="https://github.com/kentashiki" target="_blank" rel="noopener noreferrer"><img src="../assets/images/social/github-invertocat-black.svg" alt="" width="18" height="18" />GitHub</a></li>
              <li><a href="https://orcid.org/0009-0005-3312-6616" target="_blank" rel="noopener noreferrer"><img src="../assets/images/social/orcid-logo.svg" alt="" width="18" height="18" />ORCiD</a></li>
              <li><a href="https://x.com/shiki_kenta" target="_blank" rel="noopener noreferrer"><img src="../assets/images/social/x-logo-black.png" alt="" width="18" height="18" />X</a></li>
              <li><a href="https://www.instagram.com/shikikenta/" target="_blank" rel="noopener noreferrer"><img src="../assets/images/social/instagram-logo.svg" alt="" width="18" height="18" />Instagram</a></li>
          </ul>
        </section>
      </div>
    </main>
    <div data-site-footer></div>
    <script src="../assets/js/site-shell.js?v=20261017b"></script>
    <script src="../assets/js/nav-toggle.js"></script>
    <script src="../contact/contact.js?v=20261018b" defer></script>
  </body>
</html>
